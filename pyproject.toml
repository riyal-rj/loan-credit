[project]
name = "finassist"
version = "0.1.0"
description = "Agentic loan underwriting and credit decision platform (synthetic/demo)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141,<0.142",
    "starlette>=0.47.2",
    "uvicorn[standard]>=0.34,<0.53",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<25.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2.0",
    "prometheus-client>=0.21,<0.22",
    "asgi-correlation-id>=4.3,<5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<0.29",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "import-linter>=2.1,<3.0",
    "pre-commit>=4.0,<5.0",
    "hypothesis>=6.115,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finassist"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = "asgi_correlation_id.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=finassist --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/finassist"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.importlinter]
root_package = "finassist"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no framework/infrastructure dependencies"
type = "forbidden"
source_modules = ["finassist.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "kafka",
    "temporalio",
    "langgraph",
    "langfuse",
    "finassist.infrastructure",
    "finassist.api",
]

[[tool.importlinter.contracts]]
name = "Application layer depends on ports, not concrete infrastructure"
type = "forbidden"
source_modules = ["finassist.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "kafka",
    "temporalio",
    "finassist.infrastructure",
    "finassist.api",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "finassist.api",
    "finassist.ai",
    "finassist.application",
    "finassist.domain",
]
